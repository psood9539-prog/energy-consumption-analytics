<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">

<main><div class="wrap">

<div class="grid cols-2"><div class="card"><h3>Email</h3><p>You can reach me directly at:</p>
<p class="email-big"><a href="mailto:psood9539@gmail.com">psood9539@gmail.com</a></p></div>
<div class="card"><h3>Send a message</h3>

<button class="btn blue" type="submit">Send message</button><div id="result" style="margin-top:12px"></div></form></div></div>
</div></main>
